# One Deploy stage using the Rolling strategy.
# K8sRollingDeploy applies manifests and waits for pods to be Ready.
# On any failure, K8sRollingRollback automatically undoes the rollout.
#
# Import: Deployments > Pipelines > Create a Pipeline > Inline > YAML, paste, Save.
pipeline:
  name: tidbit_cd_nvironment_setup
  identifier: tidbit_cd_nvironment_setup
  projectIdentifier: <YOUR_PROJECT_IDENTIFIER>
  orgIdentifier: <YOUR_ORG_IDENTIFIER>
  tags: {}
  stages:
    - stage:
        name: Deploy to Dev
        identifier: Deploy_to_Dev
        description: Rolling deployment of nginx to the Dev environment
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <YOUR_SERVICE_IDENTIFIER>
          environment:
            environmentRef: <YOUR_ENV_IDENTIFIER>
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <YOUR_INFRA_IDENTIFIER>
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false # dry run catches bad manifests before applying
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
